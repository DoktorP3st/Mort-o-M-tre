<!-- MORT-O-MÈTRE — 4 Formes / Zéro Fond -->
<div id="dc-root">

  <!-- Effets ambiants (derrière tout) -->
  <div id="dc-smoke"></div>
  <div id="dc-blood-rain"></div>

  <!-- Aura diffuse (zéro fond, juste une lueur) -->

  <!-- Vortex particules -->
  <div id="dc-vortex"></div>

  <!-- Éclairs -->
  <div id="dc-lightning"></div>

  <!-- ══ FORME 0 : Tête d'ange ══ -->
  <div class="dc-face" id="face-0">
    <svg viewBox="0 0 220 260" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="f0fill" cx="45%" cy="35%">
          <stop offset="0%"   stop-color="#ffe8cc"/>
          <stop offset="55%"  stop-color="#d4a870"/>
          <stop offset="100%" stop-color="#8a5c2a"/>
        </radialGradient>
        <radialGradient id="f0halo" cx="50%" cy="50%">
          <stop offset="0%"   stop-color="#ffeeaa" stop-opacity=".6"/>
          <stop offset="60%"  stop-color="#ffcc44" stop-opacity=".2"/>
          <stop offset="100%" stop-color="#ffaa00" stop-opacity="0"/>
        </radialGradient>
        <filter id="f0shadow" x="-40%" y="-40%" width="180%" height="180%">
          <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity=".8"/>
          <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity=".6"/>
        </filter>
        <filter id="f0glow">
          <feGaussianBlur stdDeviation="6" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <!-- Halo d'ange -->
      <ellipse cx="110" cy="28" rx="55" ry="14" fill="url(#f0halo)" filter="url(#f0glow)"/>
      <ellipse cx="110" cy="28" rx="42" ry="8"  fill="none" stroke="#ffcc44" stroke-width="3" opacity=".7" filter="url(#f0glow)"/>
      <!-- Ailes -->
      <path d="M30 110 Q5 80 20 55 Q35 35 55 55 Q40 75 45 100Z" fill="#ffe8cc" opacity=".55" filter="url(#f0shadow)"/>
      <path d="M190 110 Q215 80 200 55 Q185 35 165 55 Q180 75 175 100Z" fill="#ffe8cc" opacity=".55" filter="url(#f0shadow)"/>
      <!-- Plumes ailes -->
      <path d="M32 108 Q12 90 22 68 Q30 52 48 62" fill="none" stroke="#ffe8cc" stroke-width="2" opacity=".4"/>
      <path d="M188 108 Q208 90 198 68 Q190 52 172 62" fill="none" stroke="#ffe8cc" stroke-width="2" opacity=".4"/>
      <!-- Visage -->
      <ellipse cx="110" cy="140" rx="72" ry="76" fill="url(#f0fill)" filter="url(#f0shadow)"/>
      <!-- Yeux fermés (paisible) -->
      <path d="M84 128 Q93 122 102 128" fill="none" stroke="#6b3a18" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M118 128 Q127 122 136 128" fill="none" stroke="#6b3a18" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Cils -->
      <path d="M86 127 L83 122" stroke="#6b3a18" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M93 124 L92 119" stroke="#6b3a18" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M100 127 L101 122" stroke="#6b3a18" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M120 127 L119 122" stroke="#6b3a18" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M127 124 L128 119" stroke="#6b3a18" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M134 127 L137 122" stroke="#6b3a18" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Nez -->
      <path d="M106 145 Q110 155 114 145" fill="none" stroke="#8a5c2a" stroke-width="1.8" stroke-linecap="round"/>
      <!-- Bouche souriante -->
      <path d="M94 165 Q110 178 126 165" fill="none" stroke="#8a5c2a" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Joues rosées -->
      <ellipse cx="82"  cy="158" rx="12" ry="8" fill="#ff9980" opacity=".3"/>
      <ellipse cx="138" cy="158" rx="12" ry="8" fill="#ff9980" opacity=".3"/>
      <!-- Reflet -->
      <ellipse cx="95" cy="115" rx="18" ry="10" fill="rgba(255,255,255,.18)" transform="rotate(-20 95 115)"/>
    </svg>
  </div>

  <!-- ══ FORME 1 : Crâne calme (1 mort) ══ -->
  <div class="dc-face" id="face-1">
    <svg viewBox="0 0 220 260" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="f1fill" cx="42%" cy="32%">
          <stop offset="0%"   stop-color="#d4a84b"/>
          <stop offset="50%"  stop-color="#8b5e12"/>
          <stop offset="100%" stop-color="#2a1504"/>
        </radialGradient>
        <radialGradient id="f1eye" cx="50%" cy="40%">
          <stop offset="0%"   stop-color="#ff8800"/>
          <stop offset="55%"  stop-color="#882200"/>
          <stop offset="100%" stop-color="#220000"/>
        </radialGradient>
        <filter id="f1shadow" x="-40%" y="-40%" width="180%" height="180%">
          <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity=".85"/>
          <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity=".6"/>
        </filter>
        <filter id="f1eyeglow">
          <feGaussianBlur stdDeviation="4" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <!-- Corps -->
      <ellipse cx="110" cy="110" rx="78" ry="80" fill="url(#f1fill)" filter="url(#f1shadow)"/>
      <!-- Mâchoire -->
      <path d="M56 158 Q66 194 110 198 Q154 194 164 158 Q143 174 110 176 Q77 174 56 158Z" fill="url(#f1fill)" filter="url(#f1shadow)"/>
      <!-- Dents -->
      <rect x="79"  y="174" width="13" height="20" rx="4" fill="#c8922a" opacity=".9"/>
      <rect x="96"  y="177" width="12" height="17" rx="4" fill="#c8922a" opacity=".85"/>
      <rect x="112" y="177" width="12" height="17" rx="4" fill="#c8922a" opacity=".85"/>
      <rect x="128" y="174" width="13" height="20" rx="4" fill="#c8922a" opacity=".9"/>
      <!-- Orbites -->
      <ellipse cx="82"  cy="108" rx="24" ry="26" fill="#0a0200"/>
      <ellipse cx="138" cy="108" rx="24" ry="26" fill="#0a0200"/>
      <!-- Yeux — lueur douce -->
      <ellipse cx="82"  cy="108" rx="18" ry="20" fill="url(#f1eye)" filter="url(#f1eyeglow)" opacity=".7"/>
      <ellipse cx="138" cy="108" rx="18" ry="20" fill="url(#f1eye)" filter="url(#f1eyeglow)" opacity=".7"/>
      <!-- Pupilles -->
      <ellipse cx="82"  cy="111" rx="7" ry="9" fill="#ff8800" opacity=".4"/>
      <ellipse cx="138" cy="111" rx="7" ry="9" fill="#ff8800" opacity=".4"/>
      <!-- Nez -->
      <path d="M103 130 L110 118 L117 130 Q110 138 103 130Z" fill="#150800" opacity=".8"/>
      <!-- Fissure simple -->
      <path d="M110 35 L105 62 L115 62Z" fill="none" stroke="#4a2808" stroke-width="1.8" opacity=".55"/>
      <!-- Reflet -->
      <ellipse cx="92" cy="82" rx="18" ry="10" fill="rgba(255,255,255,.12)" transform="rotate(-22 92 82)"/>
    </svg>
  </div>

  <!-- ══ FORME 2 : Crâne agité (2 morts) ══ -->
  <div class="dc-face" id="face-2">
    <svg viewBox="0 0 220 260" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="f2fill" cx="42%" cy="30%">
          <stop offset="0%"   stop-color="#cc6622"/>
          <stop offset="50%"  stop-color="#882200"/>
          <stop offset="100%" stop-color="#1a0400"/>
        </radialGradient>
        <radialGradient id="f2eye" cx="50%" cy="40%">
          <stop offset="0%"   stop-color="#ffdd00"/>
          <stop offset="40%"  stop-color="#ff4400"/>
          <stop offset="100%" stop-color="#1a0000"/>
        </radialGradient>
        <filter id="f2shadow" x="-40%" y="-40%" width="180%" height="180%">
          <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity=".85"/>
          
        </filter>
        <filter id="f2eyeglow">
          <feGaussianBlur stdDeviation="6" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="f2skullglow">
          <feGaussianBlur stdDeviation="8" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <!-- Halo rougeoyant -->
      <ellipse cx="110" cy="110" rx="95" ry="95" fill="#ff2200" opacity=".08" filter="url(#f2skullglow)"/>
      <!-- Corps -->
      <ellipse cx="110" cy="108" rx="80" ry="82" fill="url(#f2fill)" filter="url(#f2shadow)"/>
      <!-- Mâchoire entrouverte -->
      <path d="M54 156 Q64 198 110 202 Q156 198 166 156 Q146 178 110 180 Q74 178 54 156Z" fill="url(#f2fill)" filter="url(#f2shadow)"/>
      <!-- Dents plus agressives -->
      <rect x="76"  y="174" width="14" height="24" rx="3" fill="#cc8822" opacity=".95"/>
      <rect x="94"  y="178" width="13" height="19" rx="3" fill="#cc8822" opacity=".9"/>
      <rect x="111" y="178" width="13" height="19" rx="3" fill="#cc8822" opacity=".9"/>
      <rect x="128" y="174" width="14" height="24" rx="3" fill="#cc8822" opacity=".95"/>
      <!-- Crocs -->
      <path d="M71 172 L68 198 L78 172Z" fill="#cc8822" opacity=".8"/>
      <path d="M149 172 L152 198 L142 172Z" fill="#cc8822" opacity=".8"/>
      <!-- Orbites -->
      <ellipse cx="81"  cy="105" rx="26" ry="28" fill="#050100"/>
      <ellipse cx="139" cy="105" rx="26" ry="28" fill="#050100"/>
      <!-- Yeux — flammes jaunes vives -->
      <ellipse cx="81"  cy="105" rx="20" ry="22" fill="url(#f2eye)" filter="url(#f2eyeglow)"/>
      <ellipse cx="139" cy="105" rx="20" ry="22" fill="url(#f2eye)" filter="url(#f2eyeglow)"/>
      <ellipse cx="81"  cy="108" rx="9"  ry="11" fill="#ffdd00" opacity=".55"/>
      <ellipse cx="139" cy="108" rx="9"  ry="11" fill="#ffdd00" opacity=".55"/>
      <!-- Nez -->
      <path d="M102 128 L110 115 L118 128 Q110 138 102 128Z" fill="#0f0200" opacity=".9"/>
      <!-- Fissures multiples -->
      <path d="M110 32 L104 64 L116 64Z" fill="none" stroke="#660000" stroke-width="2" opacity=".7"/>
      <path d="M70 58 L86 80" fill="none" stroke="#550000" stroke-width="1.8" opacity=".6"/>
      <path d="M150 58 L134 80" fill="none" stroke="#550000" stroke-width="1.8" opacity=".6"/>
      <path d="M62 100 L80 118 L66 132" fill="none" stroke="#660000" stroke-width="1.5" opacity=".55"/>

      <path d="M84 125 Q82 138 84 146 Q86 138 84 125Z" fill="#cc0000" opacity=".85"/>
      <path d="M142 125 Q140 140 142 148 Q144 140 142 125Z" fill="#cc0000" opacity=".8"/>
      <!-- Reflet -->
      <ellipse cx="92" cy="80" rx="20" ry="11" fill="rgba(255,255,255,.1)" transform="rotate(-22 92 80)"/>
    </svg>
  </div>

  <!-- ══ FORME 3 : Démon infernal (3+ morts) ══ -->
  <div class="dc-face" id="face-3">
    <svg viewBox="0 0 220 270" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="f3fill" cx="42%" cy="28%">

          <stop offset="40%"  stop-color="#880000"/>

        <radialGradient id="f3aura" cx="50%" cy="50%">
          <stop offset="0%"   stop-color="#ff0000" stop-opacity=".5"/>
          <stop offset="50%"  stop-color="#880000" stop-opacity=".2"/>
          <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>
        <filter id="f3shadow" x="-40%" y="-40%" width="180%" height="180%">
          <feDropShadow dx="0" dy="2" stdDeviation="5"  flood-color="#000" flood-opacity=".88"/>
          
          <feDropShadow dx="0" dy="4" stdDeviation="4"  flood-color="#000" flood-opacity=".6"/>
        </filter>
        <filter id="f3eyeglow">
          <feGaussianBlur stdDeviation="8" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="f3aurafilter" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="15"/>
        </filter>
      </defs>

      <path d="M72 52 L50 8  L85 44Z"  fill="#880000" filter="url(#f3shadow)"/>
      <path d="M148 52 L170 8 L135 44Z" fill="#880000" filter="url(#f3shadow)"/>

      <path d="M148 52 L170 8 L135 44Z" fill="#cc2200" opacity=".5"/>

      <polygon points="170,8 164,2 176,14" fill="#ff4400"/>

      <path d="M50 165 Q60 215 110 220 Q160 215 170 165 Q148 188 110 190 Q72 188 50 165Z" fill="url(#f3fill)" filter="url(#f3shadow)"/>

      <path d="M156 180 L162 218 L146 180Z" fill="#aa6600"/>

      <path d="M88 187 L86 208 L94 187Z"  fill="#aa6600" opacity=".8"/>
      <path d="M132 187 L134 208 L126 187Z" fill="#aa6600" opacity=".8"/>
      <!-- Orbites -->
      <ellipse cx="79"  cy="112" rx="28" ry="30" fill="#020000"/>
      <ellipse cx="141" cy="112" rx="28" ry="30" fill="#020000"/>
      <!-- Yeux EXPLOSIFS -->
      <ellipse cx="79"  cy="112" rx="22" ry="24" fill="url(#f3eye)" filter="url(#f3eyeglow)"/>
      <ellipse cx="141" cy="112" rx="22" ry="24" fill="url(#f3eye)" filter="url(#f3eyeglow)"/>

      <ellipse cx="141" cy="115" rx="10" ry="12" fill="#ff6600" opacity=".7"/>
      <ellipse cx="79"  cy="115" rx="4"  ry="5"  fill="#ffffff" opacity=".6"/>
      <ellipse cx="141" cy="115" rx="4"  ry="5"  fill="#ffffff" opacity=".6"/>

      <path d="M100 140 L110 124 L120 140 Q110 152 100 140Z" fill="#0f0000" opacity=".95"/>
      <!-- Fissures partout + lueur rouge -->

      <path d="M66 62 L84 86 L68 102" fill="none" stroke="#cc0000" stroke-width="2" opacity=".65"/>
      <path d="M154 62 L136 86 L152 102" fill="none" stroke="#cc0000" stroke-width="2" opacity=".65"/>
      <path d="M52 105 L72 125 L55 142" fill="none" stroke="#ff0000" stroke-width="1.8" opacity=".6"/>
      <path d="M168 105 L148 125 L165 142" fill="none" stroke="#ff0000" stroke-width="1.8" opacity=".6"/>
      <path d="M88 172 L100 185 L90 196" fill="none" stroke="#cc0000" stroke-width="1.6" opacity=".6"/>
      <path d="M132 172 L120 185 L130 196" fill="none" stroke="#cc0000" stroke-width="1.6" opacity=".6"/>
      <!-- SANG coulant partout -->
      <path d="M82 132 Q79 150 82 162 Q85 150 82 132Z" fill="#cc0000" opacity=".95"/>
      <path d="M138 132 Q135 152 138 164 Q141 152 138 132Z" fill="#cc0000" opacity=".9"/>
      <path d="M107 76 Q105 92 107 100 Q109 92 107 76Z" fill="#cc0000" opacity=".75"/>
      <path d="M58 165 Q56 178 58 186 Q60 178 58 165Z" fill="#aa0000" opacity=".7"/>
      <path d="M162 165 Q160 178 162 186 Q164 178 162 165Z" fill="#aa0000" opacity=".7"/>
      <!-- Reflet -->

  </div>

  <!-- Burst particules event -->
  <div id="dc-burst"></div>

  <!-- Compteur -->
  <div id="dc-number-wrap">
    <div id="dc-number-shadow"></div>
    <div id="dc-number">0</div>
  </div>

</div>
